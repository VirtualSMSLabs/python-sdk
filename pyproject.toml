[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "virtualsmslabs-python-sdk"
version = "1.0.0"
description = "Python SDK for the VirtualSMS Consumer API — SMS verification, phone number rental, and activation management."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
keywords = ["sms", "verification", "phone", "virtual", "virtualsms", "sms-activate", "otp"]
authors = [
    { name = "VirtualSMS Labs", email = "contact@virtualsms.de" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Telephony",
]

[project.urls]
Homepage = "https://virtualsms.de"
Documentation = "https://virtualsms.de/docs/sdk"
Repository = "https://github.com/VirtualSMSLabs/python-sdk"
Issues = "https://github.com/VirtualSMSLabs/python-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/virtualsms"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
